; Preset: Astro's Playroom (PPSA01325), 4080/5090-class GPU: native 4K internal (render_scale 1.0), ray tracing off
; Selected with "preset = astro-high" in kestrel.ini. Values in kestrel.ini / kestrel.local.ini override these.

[game]
redzone = off

[video]
render_scale = 1.0
fullscreen = on
width = 1920
height = 1080
rt_mode = off
vertex_fetch = cpu
present_mode = Mailbox
upscaler = linear
fsr_sharpness = 0.25

[speed]
; Coming soon: needs the patch loader (--patch). Leave off until your build has it.
game_speed_patch = off
patch_name = Astro's Playroom - correct speed at 30 fps
patch_frame_cap = 30
frame_cap = 0

[debug]
overlay = off
frame_time_log =
fps_log = 0
guest_log = off
extra_args =
