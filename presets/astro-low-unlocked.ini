; Preset: Astro's Playroom (PPSA01325), correct speed at any frame rate (30 fps cap by default), 3060-class GPU: 1080p internal (render_scale 0.5), ray tracing off
; Selected with "preset = astro-low-unlocked" in kestrel.ini. Values in kestrel.ini / kestrel.local.ini override these.

[game]
redzone = off

[video]
render_scale = 0.5
fullscreen = off
width = 1920
height = 1080
rt_mode = off
vertex_fetch = cpu
present_mode = Mailbox
upscaler = linear
fsr_sharpness = 0.25

[speed]
; Correct game speed at any frame rate. To disable, set game_speed_patch = off.
; Frame cap: raise it only on a VRR display or to a divisor of your refresh rate (40 on 120 Hz, 48 on 144 Hz).
game_speed_patch = on
patch_name = Astro's Playroom - correct speed at any frame rate
patch_frame_cap =
frame_cap = 30

[debug]
overlay = off
frame_time_log =
fps_log = 0
guest_log = off
extra_args =
