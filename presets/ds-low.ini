; Preset: Demon's Souls (PPSA01342), 3060-class GPU: render_scale 0.5, ray tracing off, red-zone protection on
; Selected with "preset = ds-low" in kestrel.ini. Values in kestrel.ini / kestrel.local.ini override these.

[game]
redzone = on

[video]
render_scale = 0.5
fullscreen = off
width = 1920
height = 1080
rt_mode = off
vertex_fetch = cpu
present_mode = Mailbox
upscaler = linear
fsr_sharpness = 0.25

[speed]
; No game-speed patch for Demon's Souls yet.
game_speed_patch = off
patch_name =
patch_frame_cap =
frame_cap = 0

[debug]
overlay = off
frame_time_log =
fps_log = 0
guest_log = off
extra_args =
