; Preset: Astro's Playroom (PPSA01325), correct speed at any frame rate (no frame cap), 4080/5090-class GPU: native 4K internal (render_scale 1.0), ray tracing off
; Selected with "preset = astro-high-unlocked" in kestrel.ini. Values in kestrel.ini / kestrel.local.ini override these.

[game]
redzone = off

[video]
render_scale = 1.0
fullscreen = on
width = 1920
height = 1080
rt_mode = off
vertex_fetch = cpu
present_mode = Mailbox
upscaler = linear
fsr_sharpness = 0.25

[speed]
; Correct game speed at any frame rate (no frame cap needed). To disable, set game_speed_patch = off.
game_speed_patch = on
patch_name = Astro's Playroom - correct speed at any frame rate
patch_frame_cap =
frame_cap = 0

[debug]
overlay = off
frame_time_log =
fps_log = 0
guest_log = off
extra_args =
