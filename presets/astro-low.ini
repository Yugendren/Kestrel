; Preset: Astro's Playroom (PPSA01325), 3060-class GPU: 1080p internal (render_scale 0.5), ray tracing off
; Selected with "preset = astro-low" in kestrel.ini. Values in kestrel.ini / kestrel.local.ini override these.

[game]
redzone = off

[video]
render_scale = 0.5
fullscreen = off
width = 1920
height = 1080
rt_mode = off
vertex_fetch = cpu
present_mode = Mailbox
upscaler = linear
fsr_sharpness = 0.25

[speed]
; Correct game speed at 30 fps (needs --frame-cap 30, set by patch_frame_cap). To disable, set game_speed_patch = off.
game_speed_patch = on
patch_name = Astro's Playroom - correct speed at 30 fps
patch_frame_cap = 30
frame_cap = 0

[debug]
overlay = off
frame_time_log =
fps_log = 0
guest_log = off
extra_args =
