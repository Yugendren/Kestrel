; Kestrel launcher settings, read by kestrel.sh (Linux) and kestrel.bat / kestrel.ps1 (Windows).
;
; How it works:
;   1. The preset named below is loaded from presets/<preset>.ini.
;   2. Every non-empty value in this file overrides the preset.
;   3. If kestrel.local.ini exists next to this file, its non-empty values override both.
;      Put your own settings there (it is ignored by git), so `git pull` never conflicts.
;   An empty value (e.g. "render_scale =") means "use the preset's value".
;
; Lines starting with ; or # are comments. Values are not quoted. on/off, true/false, yes/no and
; 1/0 are all accepted for switches.
;
; Settings marked "coming soon" need an emulator feature that is not on main yet. The launcher
; checks `kyty_emulator --help`: if your build lacks the flag, it prints a warning and skips that
; setting instead of failing.

[launcher]
; Which preset to start from (a file in presets/):
;   astro-low   Astro's Playroom, 3060-class GPU (render_scale 0.5 = 1080p internal)
;   astro-high  Astro's Playroom, 4080/5090-class GPU (render_scale 1.0 = native 4K internal)
;   ds-low      Demon's Souls, 3060-class GPU
;   ds-high     Demon's Souls, 4080/5090-class GPU
;   default     plain emulator defaults
preset = astro-low
; Path to kyty_emulator (kyty_emulator.exe on Windows). Empty = look in the usual build folders:
; _Build/windows/install, _Build/windows, _Build/linux/install, _Build/linux.
emulator =

[game]
; Folder of YOUR OWN game dump (the folder that contains eboot.bin). Kestrel never ships games.
; Example (Windows): path = D:\Games\PS5\PPSA01325
; Example (Linux):   path = /home/me/games/PPSA01325
path =
; Protect the guest red zone (--redzone). Needed by Demon's Souls on Windows; ignored on Linux,
; which does not need it.
redzone =

[video]
; Internal render resolution scale, 0.1 - 4.0. 0.5 = half width and height (quarter the pixels),
; the main GPU saver; 1.0 = the game's native resolution.
render_scale =
; Borderless desktop fullscreen (--fullscreen). on/off.
fullscreen =
; Window size when not fullscreen.
width =
height =
; Ray tracing: full | reduced | off. off is fastest and what our numbers use.
rt_mode =
; Vertex fetch: cpu | gpu. cpu is the tested default.
vertex_fetch =
; Present mode: Fifo (vsync) | Mailbox | Immediate.
present_mode =
; Upscaler from render resolution to the window: linear | fsr1.
; fsr1 = AMD FSR 1 (edge-adaptive upscale + sharpening). Coming soon (--upscaler).
upscaler =
; FSR 1 sharpness in stops, 0 = sharpest, up to 2. Coming soon (--fsr-sharpness).
fsr_sharpness =

[speed]
; Apply the game's "correct speed" patch (patch_name below). Coming soon (patch loader, --patch).
; Some games run slow when they render below 60 fps; the patch fixes the game speed for the
; frame cap in patch_frame_cap.
game_speed_patch =
; Exact patch name (set by the preset).
patch_name =
; Frame cap the patch needs; used as frame_cap when game_speed_patch is on and frame_cap is 0.
patch_frame_cap =
; Cap presented frames per second (--frame-cap); 0 = off. Does not change game speed by itself.
frame_cap =

[debug]
; Performance overlay at start (F10 toggles). Coming soon (--perf-overlay). Until then the window
; title shows "frame: N, fps: N".
overlay =
; Write one line per presented frame ("frame time_us") to this file. Coming soon
; (--frame-time-log). Empty = off.
frame_time_log =
; Log fps counters to the guest log every N seconds (--fps-log); 0 = off.
fps_log =
; Write the game's own log output to kestrel-logs/<time>.guest.log. on/off.
guest_log =
; Anything else, passed to kyty_emulator unchanged (space separated), e.g. --anisotropy 4
extra_args =
